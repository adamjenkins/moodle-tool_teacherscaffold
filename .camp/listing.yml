name: tool_teacherscaffold
summary: 'An admin tool that eases new teachers into Moodle by unlocking activity types in stages as they try the ones they already have.'
description: |
  Guided teachers start with a few simple activity types (File, Page, Forum,
  Text and media area). More are unlocked as they use them, stage by stage,
  until everything is available. Each stage is a plugin-managed site role that
  prohibits adding the still-locked activities, and by default also blocks
  import and restore. Admins configure the stages and the unlock rule, add
  teachers automatically or by cohort, and follow progress in a "Guided
  teachers" report. Any teacher can choose "Show me everything" at any time.
